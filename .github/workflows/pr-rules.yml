name: PR-regler

# Tjekker selve pull requesten (ikke koden): Linear-kobling, skabelon og størrelse.
# Kører igen når titel, beskrivelse eller labels ændres.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled, ready_for_review]

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  rules:
    name: PR-regler
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v9
        env:
          # Linear-holdets nøgle (det der står før tallet i TRE-123). Kan ændres under
          # Settings → Secrets and variables → Actions → Variables.
          LINEAR_TEAM_KEY: ${{ vars.LINEAR_TEAM_KEY || 'TRE' }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const isBot = pr.user.type === 'Bot';
            const problems = [];

            // ---- 1. Størrelse: små PR'er er hurtige at reviewe og nemme at rulle tilbage ----
            const ignored = [/^package-lock\.json$/, /^src\/lib\/database\.types\.ts$/, /^supabase\/config\.toml$/, /^\.claude\/skills\//];
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const lines = files
              .filter((f) => !ignored.some((re) => re.test(f.filename)))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const sizes = [
              ['size/XS', 50, '0e8a16', 'Under 50 linjer. Reviewes først.'],
              ['size/S', 200, '5ebd3e', 'Under 200 linjer. Reviewes først.'],
              ['size/M', 400, 'fbca04', 'Under 400 linjer.'],
              ['size/L', 800, 'e99695', 'Under 800 linjer. Overvej at dele op.'],
              ['size/XL', Infinity, 'b60205', '800+ linjer. Skal deles op eller have stor-pr-godkendt.'],
            ];
            const [size] = sizes.find(([, max]) => lines < max);
            const override = 'stor-pr-godkendt';

            const existing = (await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map((l) => l.name);
            for (const [name, , color, description] of sizes) {
              if (!existing.includes(name)) await github.rest.issues.createLabel({ owner, repo, name, color, description });
            }
            if (!existing.includes(override)) {
              await github.rest.issues.createLabel({ owner, repo, name: override, color: '5319e7', description: 'En erfaren har sagt ja til en stor PR' });
            }
            const current = pr.labels.map((l) => l.name);
            for (const name of current.filter((n) => n.startsWith('size/') && n !== size)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name }).catch(() => {});
            }
            if (!current.includes(size)) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [size] });

            if (size === 'size/XL' && !current.includes(override) && !isBot) {
              problems.push(`PR'en er på ${lines} linjer (grænsen er 800). Del den op i mindre PR'er, eller bed en erfaren om at sætte labelen \`${override}\`.`);
            }

            if (!isBot) {
              // ---- 2. Linear: opgavens ID skal stå i branch-navnet eller titlen ----
              const key = process.env.LINEAR_TEAM_KEY;
              const id = new RegExp(`(^|[^a-z0-9])${key}-\\d+`, 'i');
              if (!id.test(pr.head.ref) && !id.test(pr.title)) {
                problems.push(`Linear-opgaven mangler. Branch-navnet eller titlen skal indeholde opgavens ID, fx \`${key.toLowerCase()}-123-kort-navn\`. Nemmest: tryk "Copy git branch name" på opgaven i Linear.`);
              }

              // ---- 3. Skabelonen: bevis og rollback skal være udfyldt ----
              const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
              const section = (title) => {
                const m = body.match(new RegExp(`##\\s*${title}[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, 'i'));
                return m ? m[1].trim() : null;
              };
              const proof = section('Bevis');
              if (proof === null || proof.length < 10) {
                problems.push('Udfyld "Bevis for at det virker" i beskrivelsen: et skærmbillede, link til preview eller output fra en test.');
              }
              const rollback = section('Rollback');
              const ticked = rollback ? (rollback.match(/- \[x\]/gi) || []).length : 0;
              if (ticked !== 1) {
                problems.push('Sæt præcis ét kryds under "Rollback" i beskrivelsen: nem eller svær at rulle tilbage.');
              }
            }

            core.summary.addHeading('PR-regler', 3).addRaw(`Størrelse: **${size}** (${lines} linjer uden lockfiler og genererede filer).`, true);
            if (problems.length) {
              core.summary.addList(problems);
              await core.summary.write();
              core.setFailed(problems.join('\n'));
            } else {
              core.summary.addRaw('Alt er i orden.', true);
              await core.summary.write();
            }
